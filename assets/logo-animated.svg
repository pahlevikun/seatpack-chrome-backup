<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 256" width="904" height="256" fill="none" role="img" aria-label="seatpack, Chrome profiles and editor plugins, in one bag. Restore merges by email.">
  <defs>
    <style>
      .cursor-block {
        animation: cursor-blink 1.1s steps(2, start) infinite;
      }
      .mini-strap {
        stroke-dasharray: 90;
        stroke-dashoffset: 90;
        animation: mini-strap-draw 6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .mini-bag {
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: mini-bag-draw 6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .mini-cord {
        stroke-dasharray: 50;
        stroke-dashoffset: 50;
        animation: mini-cord-draw 6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .mini-tag {
        transform-origin: 101px 100px;
        animation: mini-tag-pop 6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .merge-frame {
        stroke-dasharray: 960;
        stroke-dashoffset: 960;
        animation: merge-draw 6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .flow-dot {
        animation: flow-dot 6s ease-in-out infinite;
      }
      .email-pill {
        transform-origin: 358px 196px;
        animation: email-pill 6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .stage-list { animation: pulse-list 6s ease-in-out infinite; }
      .stage-quit { animation: pulse-quit 6s ease-in-out infinite; }
      .stage-pack { animation: pulse-pack 6s ease-in-out infinite; }
      .stage-merge { animation: pulse-merge 6s ease-in-out infinite; }
      @keyframes cursor-blink {
        0%, 49% { opacity: 0.9; }
        50%, 100% { opacity: 0.15; }
      }
      @keyframes mini-strap-draw {
        0%, 6% { stroke-dashoffset: 90; }
        24%, 88% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 90; }
      }
      @keyframes mini-bag-draw {
        0%, 12% { stroke-dashoffset: 260; }
        32%, 88% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 260; }
      }
      @keyframes mini-cord-draw {
        0%, 22% { stroke-dashoffset: 50; }
        40%, 88% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 50; }
      }
      @keyframes mini-tag-pop {
        0%, 28% { transform: scale(0.92); }
        44%, 88% { transform: scale(1); }
        96%, 100% { transform: scale(0.92); }
      }
      @keyframes merge-draw {
        0%, 28% { stroke-dashoffset: 960; }
        48%, 88% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 960; }
      }
      @keyframes flow-dot {
        0%, 10% { transform: translateY(0); }
        42%, 88% { transform: translateY(66px); }
        96%, 100% { transform: translateY(0); }
      }
      @keyframes email-pill {
        0%, 50% { transform: scale(0.98); }
        64%, 88% { transform: scale(1); }
        96%, 100% { transform: scale(0.98); }
      }
      @keyframes pulse-list {
        0%, 18% { fill: #c99d48; }
        22%, 100% { fill: #98a2b6; }
      }
      @keyframes pulse-quit {
        0%, 16% { fill: #4a4f7a; }
        18%, 34% { fill: #c99d48; }
        38%, 100% { fill: #98a2b6; }
      }
      @keyframes pulse-pack {
        0%, 32% { fill: #4a4f7a; }
        36%, 52% { fill: #c99d48; }
        56%, 100% { fill: #98a2b6; }
      }
      @keyframes pulse-merge {
        0%, 48% { fill: #98a2b6; }
        54%, 88% { fill: #c99d48; }
        96%, 100% { fill: #98a2b6; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cursor-block, .mini-strap, .mini-bag, .mini-cord, .mini-tag,
        .merge-frame, .flow-dot, .email-pill,
        .stage-list, .stage-quit, .stage-pack, .stage-merge {
          animation: none !important;
          stroke-dashoffset: 0 !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>
  <rect x="2" y="2" width="900" height="252" rx="18" fill="#17152e" stroke="#3a3358" stroke-width="2"/>

  <g transform="translate(28, 60)">
    <rect x="0" y="0" width="136" height="136" rx="32" fill="#17152e" stroke="#3a3358" stroke-width="2"/>
    <path class="mini-strap" d="M 36 42 C 36 16, 78 16, 78 42" fill="none" stroke="#c99d48" stroke-width="4.5" stroke-linecap="round"/>
    <defs>
      <clipPath id="minibag">
        <rect x="24" y="38" width="64" height="74" rx="12"/>
      </clipPath>
    </defs>
    <g clip-path="url(#minibag)">
      <rect x="24" y="54" width="64" height="20" fill="#b2853a"/>
      <rect x="24" y="74" width="64" height="18" fill="#3c7f7c"/>
      <rect x="24" y="92" width="64" height="20" fill="#66589a"/>
      <path d="M24 54 C 40 64, 72 64, 88 54 L 88 38 L 24 38 Z" fill="#3a3358"/>
      <rect x="50" y="44" width="12" height="4" rx="1" fill="#c99d48"/>
    </g>
    <rect class="mini-bag" x="24" y="38" width="64" height="74" rx="12" fill="none" stroke="#e8e4f4" stroke-width="2"/>
    <path class="mini-cord" d="M 88 58 C 104 68, 108 84, 96 96" fill="none" stroke="#c99d48" stroke-width="2" stroke-linecap="round"/>
    <g class="mini-tag">
      <rect x="78" y="86" width="46" height="28" rx="5" fill="#e8e4f4" stroke="#c99d48" stroke-width="1.5"/>
      <circle cx="88" cy="96" r="2.2" fill="#17152e"/>
      <text x="86" y="106" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="600" fill="#17152e">ada@</text>
    </g>
  </g>

  <text x="184" y="106" font-family="IBM Plex Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.6">
    <tspan fill="#e8e4f4">seat</tspan><tspan fill="#c99d48">pack</tspan>
  </text>
  <rect class="cursor-block" x="328" y="78" width="10" height="30" rx="2" fill="#c99d48" opacity="0.85"/>

  <text x="186" y="134" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14.5" font-weight="500" fill="#98a2b6">one bag. merge by email.</text>

  <g transform="translate(186, 152)" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">
    <rect x="0" y="0" width="90" height="26" rx="6" fill="#3a3358" stroke="#b2853a" stroke-width="1.2"/>
    <circle cx="13" cy="13" r="3.5" fill="#c99d48"/>
    <text x="23" y="17" fill="#e8e4f4">profiles</text>
    <rect x="98" y="0" width="133" height="26" rx="6" fill="#3a3358" stroke="#3c7f7c" stroke-width="1.2"/>
    <text x="114" y="17" fill="#e8e4f4">editor plugins</text>
  </g>

  <text x="186" y="198" font-family="IBM Plex Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-style="italic" fill="#98a2b6">A bag that refuses to sit</text>
  <text x="186" y="214" font-family="IBM Plex Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-style="italic" fill="#98a2b6">on the wrong person.</text>

  <g transform="translate(456, 22)">
    <rect x="0" y="0" width="424" height="212" rx="12" fill="#3a3358" stroke="#4a4f7a" stroke-width="1.5"/>
    <path d="M 0 12 A 12 12 0 0 1 12 0 H 412 A 12 12 0 0 1 424 12 V 36 H 0 Z" fill="#4a4f7a"/>
    <line x1="0" y1="36" x2="424" y2="36" stroke="#17152e" stroke-width="1.2"/>
    <circle cx="16" cy="18" r="4" fill="#66589a"/>
    <circle cx="30" cy="18" r="4" fill="#3c7f7c"/>
    <circle cx="44" cy="18" r="4" fill="#c99d48"/>
    <rect x="62" y="8" width="90" height="20" rx="5" fill="#17152e" stroke="#b2853a" stroke-width="1"/>
    <circle cx="73" cy="18" r="3" fill="#c99d48"/>
    <text x="82" y="22" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" fill="#c99d48">inventory</text>
    <text x="318" y="22" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#98a2b6">merge by email</text>

    <line x1="22" y1="54" x2="22" y2="156" stroke="#4a4f7a" stroke-width="2" stroke-linecap="round"/>
    <circle class="flow-dot" cx="22" cy="54" r="4" fill="#98a2b6"/>

    <g font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
      <text x="36" y="58" fill="#e8e4f4" font-weight="600">01 list</text>
      <text x="36" y="76" fill="#98a2b6">Default</text>
      <text x="150" y="76" fill="#e8e4f4">ada@example.com</text>
      <text x="36" y="94" fill="#98a2b6">Profile 1</text>
      <text x="150" y="94" fill="#e8e4f4">budi@example.com</text>

      <rect class="merge-frame" x="10" y="104" width="404" height="68" rx="6" fill="#17152e" stroke="#b2853a" stroke-width="1.2"/>
      <circle cx="22" cy="120" r="4" fill="#c99d48"/>
      <text x="36" y="124" fill="#c99d48" font-weight="600">02 merge</text>
      <text x="36" y="142" fill="#e8e4f4">ada@example.com</text>
      <text x="230" y="142" fill="#3c7f7c">keep</text>
      <text x="36" y="160" fill="#e8e4f4">budi@example.com</text>
      <text x="230" y="160" fill="#c99d48">Profile N</text>
    </g>

    <line x1="0" y1="180" x2="424" y2="180" stroke="#17152e" stroke-width="1.2"/>
    <g font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600">
      <text class="stage-list" x="16" y="200" fill="#98a2b6">list</text>
      <text x="48" y="200" fill="#4a4f7a">&#8594;</text>
      <text class="stage-quit" x="66" y="200" fill="#98a2b6">quit</text>
      <text x="100" y="200" fill="#4a4f7a">&#8594;</text>
      <text class="stage-pack" x="118" y="200" fill="#98a2b6">pack</text>
      <text x="156" y="200" fill="#4a4f7a">&#8594;</text>
      <text class="stage-merge" x="174" y="200" fill="#c99d48">merge</text>
      <g class="email-pill">
        <rect x="308" y="186" width="100" height="20" rx="4" fill="#17152e" stroke="#b2853a" stroke-width="1"/>
        <text x="324" y="200" fill="#c99d48">by email</text>
      </g>
    </g>
  </g>
</svg>
