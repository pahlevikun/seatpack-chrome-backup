<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-label="seatpack, a bag with an email tag">
  <defs>
    <clipPath id="bagbody">
      <rect x="136" y="184" width="232" height="224" rx="40"/>
    </clipPath>
    <style>
      .strap-draw {
        stroke-dasharray: 320;
        stroke-dashoffset: 320;
        animation: draw-strap 4.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .bag-draw {
        stroke-dasharray: 860;
        stroke-dashoffset: 860;
        animation: draw-bag 4.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .cord-draw {
        stroke-dasharray: 180;
        stroke-dashoffset: 180;
        animation: draw-cord 4.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .tag-pop {
        transform-origin: 384px 344px;
        animation: tag-pop 4.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      @keyframes draw-strap {
        0%, 8% { stroke-dashoffset: 320; }
        28%, 86% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 320; }
      }
      @keyframes draw-bag {
        0%, 16% { stroke-dashoffset: 860; }
        40%, 86% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 860; }
      }
      @keyframes draw-cord {
        0%, 32% { stroke-dashoffset: 180; }
        52%, 86% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 180; }
      }
      @keyframes tag-pop {
        0%, 36% { transform: scale(0.92); }
        52%, 86% { transform: scale(1); }
        96%, 100% { transform: scale(0.92); }
      }
      @media (prefers-reduced-motion: reduce) {
        .strap-draw, .bag-draw, .cord-draw, .tag-pop {
          animation: none !important;
          stroke-dashoffset: 0 !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#F8F9FA" stroke="#DADCE0" stroke-width="6"/>
  <path class="strap-draw" d="M 188 200 C 188 108, 348 108, 348 200" fill="none" stroke="#EA4335" stroke-width="16" stroke-linecap="round"/>
  <g clip-path="url(#bagbody)">
    <rect x="136" y="228" width="232" height="64" fill="#FBBC04"/>
    <rect x="136" y="292" width="232" height="58" fill="#34A853"/>
    <rect x="136" y="350" width="232" height="58" fill="#4285F4"/>
    <path d="M136 228 C 200 252, 304 252, 368 228 L 368 184 L 136 184 Z" fill="#E8EAED"/>
    <rect x="232" y="198" width="40" height="10" rx="3" fill="#EA4335"/>
  </g>
  <rect class="bag-draw" x="136" y="184" width="232" height="224" rx="40" fill="none" stroke="#3C4043" stroke-width="7"/>
  <path class="cord-draw" d="M 368 230 C 420 258, 408 304, 330 322" fill="none" stroke="#EA4335" stroke-width="5" stroke-linecap="round"/>
  <g class="tag-pop">
    <rect x="304" y="300" width="160" height="88" rx="14" fill="#FFFFFF" stroke="#4285F4" stroke-width="4"/>
    <circle cx="326" cy="322" r="6" fill="#202124"/>
    <circle cx="326" cy="322" r="3" fill="#4285F4"/>
    <text x="318" y="366" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#202124">ada@example.com</text>
  </g>
</svg>
