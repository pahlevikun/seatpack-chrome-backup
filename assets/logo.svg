<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 256" width="904" height="256" fill="none" role="img" aria-label="seatpack, Chrome profiles and editor plugins, in one bag. Restore merges by email.">
  <rect x="2" y="2" width="900" height="252" rx="18" fill="#F8F9FA" stroke="#DADCE0" stroke-width="2"/>

  <g transform="translate(28, 60)">
    <rect x="0" y="0" width="136" height="136" rx="32" fill="#FFFFFF" stroke="#DADCE0" stroke-width="2"/>
    <path d="M 36 42 C 36 16, 78 16, 78 42" fill="none" stroke="#EA4335" stroke-width="4.5" stroke-linecap="round"/>
    <g>
      <defs>
        <clipPath id="minibag">
          <rect x="24" y="38" width="64" height="74" rx="12"/>
        </clipPath>
      </defs>
      <g clip-path="url(#minibag)">
        <rect x="24" y="54" width="64" height="20" fill="#FBBC04"/>
        <rect x="24" y="74" width="64" height="18" fill="#34A853"/>
        <rect x="24" y="92" width="64" height="20" fill="#4285F4"/>
        <path d="M24 54 C 40 64, 72 64, 88 54 L 88 38 L 24 38 Z" fill="#E8EAED"/>
        <rect x="50" y="44" width="12" height="4" rx="1" fill="#EA4335"/>
      </g>
      <rect x="24" y="38" width="64" height="74" rx="12" fill="none" stroke="#3C4043" stroke-width="2"/>
    </g>
    <path d="M 88 58 C 104 68, 108 84, 96 96" fill="none" stroke="#EA4335" stroke-width="2" stroke-linecap="round"/>
    <g>
      <rect x="78" y="86" width="46" height="28" rx="5" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.5"/>
      <circle cx="88" cy="96" r="2.2" fill="#202124"/>
      <text x="86" y="106" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="600" fill="#202124">ada@</text>
    </g>
  </g>

  <text x="184" y="106" font-family="IBM Plex Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.6">
    <tspan fill="#202124">seat</tspan><tspan fill="#4285F4">pack</tspan>
  </text>
  <rect x="328" y="78" width="10" height="7" rx="2" fill="#4285F4" opacity="0.92"/>
  <rect x="328" y="85" width="10" height="7" rx="2" fill="#EA4335" opacity="0.92"/>
  <rect x="328" y="92" width="10" height="7" rx="2" fill="#FBBC04" opacity="0.92"/>
  <rect x="328" y="99" width="10" height="7" rx="2" fill="#34A853" opacity="0.92"/>

  <text x="186" y="134" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14.5" font-weight="500" fill="#5F6368">one bag. merge by email.</text>

  <g transform="translate(186, 152)" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">
    <rect x="0" y="0" width="90" height="26" rx="6" fill="#F1F3F4" stroke="#FBBC04" stroke-width="1.2"/>
    <circle cx="13" cy="13" r="3.5" fill="#EA4335"/>
    <text x="23" y="17" fill="#202124">profiles</text>
    <rect x="98" y="0" width="133" height="26" rx="6" fill="#F1F3F4" stroke="#34A853" stroke-width="1.2"/>
    <text x="114" y="17" fill="#202124">editor plugins</text>
  </g>

  <text x="186" y="198" font-family="IBM Plex Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-style="italic" fill="#5F6368">A bag that refuses to sit</text>
  <text x="186" y="214" font-family="IBM Plex Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-style="italic" fill="#5F6368">on the wrong person.</text>

  <g transform="translate(456, 22)">
    <rect x="0" y="0" width="424" height="212" rx="12" fill="#FFFFFF" stroke="#E8EAED" stroke-width="1.5"/>
    <path d="M 0 12 A 12 12 0 0 1 12 0 H 412 A 12 12 0 0 1 424 12 V 36 H 0 Z" fill="#F1F3F4"/>
    <line x1="0" y1="36" x2="424" y2="36" stroke="#DADCE0" stroke-width="1.2"/>
    <circle cx="16" cy="18" r="4" fill="#EA4335" />
    <circle cx="30" cy="18" r="4" fill="#FBBC04"/>
    <circle cx="44" cy="18" r="4" fill="#34A853"/>
    <rect x="62" y="8" width="90" height="20" rx="5" fill="#FFFFFF" stroke="#4285F4" stroke-width="1"/>
    <circle cx="73" cy="18" r="3" fill="#4285F4"/>
    <text x="82" y="22" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" fill="#4285F4">inventory</text>
    <text x="318" y="22" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5F6368">merge by email</text>

    <line x1="22" y1="54" x2="22" y2="156" stroke="#E8EAED" stroke-width="2" stroke-linecap="round"/>
    <circle cx="22" cy="54" r="4" fill="#5F6368"/>

    <g font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
      <text x="36" y="58" fill="#202124" font-weight="600">01 list</text>
      <text x="36" y="76" fill="#5F6368">Default</text>
      <text x="150" y="76" fill="#202124">ada@example.com</text>
      <text x="36" y="94" fill="#5F6368">Profile 1</text>
      <text x="150" y="94" fill="#202124">budi@example.com</text>

      <rect x="10" y="104" width="404" height="68" rx="6" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.2"/>
      <circle cx="22" cy="120" r="4" fill="#4285F4"/>
      <text x="36" y="124" fill="#4285F4" font-weight="600">02 merge</text>
      <text x="36" y="142" fill="#202124">ada@example.com</text>
      <text x="230" y="142" fill="#34A853">keep</text>
      <text x="36" y="160" fill="#202124">budi@example.com</text>
      <text x="230" y="160" fill="#4285F4">Profile N</text>
    </g>

    <line x1="0" y1="180" x2="424" y2="180" stroke="#DADCE0" stroke-width="1.2"/>
    <g font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600">
      <text x="16" y="200" fill="#5F6368">list</text>
      <text x="48" y="200" fill="#9AA0A6">&#8594;</text>
      <text x="66" y="200" fill="#5F6368">quit</text>
      <text x="100" y="200" fill="#E8EAED">&#8594;</text>
      <text x="118" y="200" fill="#5F6368">pack</text>
      <text x="156" y="200" fill="#E8EAED">&#8594;</text>
      <text x="174" y="200" fill="#4285F4">merge</text>
      <rect x="308" y="186" width="100" height="20" rx="4" fill="#FFFFFF" stroke="#4285F4" stroke-width="1"/>
      <text x="324" y="200" fill="#4285F4">by email</text>
    </g>
  </g>
</svg>
